camera:
  device_index: 0
  width: 1280
  height: 720
  api_preference: "dshow"

detection:
  model: "yolov8n.pt"
  conf_threshold: 0.45
  iou_threshold: 0.45
  device: "cpu"

density:
  enabled: true
  min_people_for_crowd: 2
  closeness_threshold: 0.15
  min_close_pairs: 1

display:
  window_name: "Crowd Detection"
  show_fps: true
  show_count: true
  show_conf: true
  show_density: true
  box_color: [0, 255, 0]
  crowd_box_color: [0, 0, 255]
  line_color: [0, 0, 255]
  text_color: [255, 255, 255]
  badge_color: [40, 40, 40]

audio:
  enabled: true
  file_path: "assets/crowd_alert.mp3"
  persist_duration: 0.0
  cooldown: 0.0

stampede:
  enabled: true
  min_people: 3
  critical_people: 8
  walking_speed_kmh: 4.0
  panic_speed_kmh: 12.0
  panic_variance_kmh: 5.0
