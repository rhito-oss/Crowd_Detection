[project]
name = "crowd-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rhitobroto", email = "rhitabrata41@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "opencv-contrib-python>=5.0.0.93",
    "pyyaml>=6.0.3",
    "ultralytics>=8.4.215",
]

[project.scripts]
crowd-detection = "crowd_detection:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
